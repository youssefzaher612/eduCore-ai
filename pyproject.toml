[project]
name = "educore"
version = "1.0.0"
description = "EduCore — A complete RAG system for education with Student and Teacher sections"
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "email-validator>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",

    # Text LLM and Gemini image understanding
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "Pillow>=10.0.0",

    # Embeddings (local, free)
    "sentence-transformers>=3.0.0",

    # RAG — text splitting
    "langchain-text-splitters>=0.2.0",

    # Document extraction
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",

    # Task queue
    "celery[rabbitmq]>=5.4.0",
    "redis>=5.0.0",

    # Settings & utils
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
streamlit = [
    "streamlit>=1.37.0",
    "sseclient-py>=1.8.0",
    "sympy>=1.12",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["educore"]

[tool.ruff]
target-version = "py311"
line-length = 100
